name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"

jobs:
  quality:
    name: Verify commit checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for checks on the tagged commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in {1..80}; do
            state=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
              --branch main --event push --limit 100 \
              --json workflowName,status,conclusion,createdAt | jq -r '
                . as $runs |
                [ ["CI", "Lint", "Supply Chain", "CodeQL"][] | . as $name |
                  [$runs[] | select(.workflowName == $name)] | max_by(.createdAt)
                ] as $checks |
                if any($checks[]; .status == "completed" and .conclusion != "success") then "failed"
                elif all($checks[]; .status == "completed" and .conclusion == "success") then "success"
                else "pending" end')
            case "$state" in
              success) exit 0 ;;
              failed) echo "::error::Required checks failed on $GITHUB_SHA"; exit 1 ;;
              pending) echo "Waiting for required checks on $GITHUB_SHA (attempt $attempt/80)" ;;
            esac
            sleep 15
          done
          echo "::error::Required checks did not complete on $GITHUB_SHA"
          exit 1

  build:
    name: Build (${{ matrix.target }})
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-apple-darwin
            os: macos-15-intel
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: ${{ matrix.target }}
          cache: false

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cross@0.2.5

      - name: Build release binary
        shell: bash
        env:
          MATRIX_TARGET: ${{ matrix.target }}
          MATRIX_CROSS: ${{ matrix.cross }}
        run: |
          set -euo pipefail
          if [ "$MATRIX_CROSS" = "true" ]; then
            cross build --release --locked --target "$MATRIX_TARGET"
          else
            toolchain="$(rustup show active-toolchain | awk '{print $1}')"
            CARGO="$(rustup which --toolchain "$toolchain" cargo)"
            RUSTC="$(rustup which --toolchain "$toolchain" rustc)"
            export CARGO RUSTC
            "$CARGO" build --release --locked --target "$MATRIX_TARGET"
          fi

      - name: Execute native release binary
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        shell: bash
        env:
          MATRIX_TARGET: ${{ matrix.target }}
          MATRIX_OS: ${{ matrix.os }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          binary="target/${MATRIX_TARGET}/release/datadog-cli"
          if [ "$MATRIX_OS" = "windows-latest" ]; then
            binary="${binary}.exe"
          fi
          actual_version=$("$binary" --version)
          test "$actual_version" = "datadog-cli ${RELEASE_TAG#v}"
          "$binary" --help > /dev/null

      - name: Package binary
        id: package
        shell: bash
        env:
          MATRIX_TARGET: ${{ matrix.target }}
          MATRIX_OS: ${{ matrix.os }}
          GH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          version="${GH_REF#refs/tags/v}"
          target="$MATRIX_TARGET"
          stem="datadog-cli-v${version}-${target}"

          mkdir -p staging
          if [ "$MATRIX_OS" = "windows-latest" ]; then
            cp "target/${target}/release/datadog-cli.exe" staging/datadog-cli.exe
            archive="${stem}.zip"
            (cd staging && 7z a "../${archive}" datadog-cli.exe >/dev/null)
          else
            cp "target/${target}/release/datadog-cli" staging/datadog-cli
            archive="${stem}.tar.gz"
            tar -C staging -czf "${archive}" datadog-cli
          fi

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${archive}" > "${archive}.sha256"
          else
            shasum -a 256 "${archive}" > "${archive}.sha256"
          fi

          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          echo "checksum=${archive}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 7

  hashes:
    name: Aggregate hashes
    needs: build
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.collect.outputs.hashes }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Compute base64 SHA256 subjects
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          hashes=$(
            find . -maxdepth 1 -type f ! -name '*.sha256' -printf '%f\n' \
              | sort \
              | xargs -r sha256sum \
              | base64 -w0
          )
          echo "hashes=${hashes}" >> "$GITHUB_OUTPUT"

  provenance:
    name: SLSA provenance
    needs: hashes
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.hashes.outputs.hashes }}
      provenance-name: datadog-cli.intoto.jsonl
      upload-assets: false

  release:
    name: Publish release
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Download SLSA provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          name: ${{ needs.provenance.outputs.provenance-name }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Sign release artifacts (sigstore keyless)
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for f in *; do
            case "$f" in
              *.sha256|*.bundle|*.intoto.jsonl) continue ;;
            esac
            cosign sign-blob --yes \
              --bundle "${f}.bundle" \
              "$f"
          done

      - name: Mirror per-tag assets to "latest" alias
        shell: bash
        env:
          GH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          version="${GH_REF#refs/tags/v}"
          prefix="datadog-cli-v${version}-"
          cd dist
          shopt -s nullglob
          for f in "${prefix}"*; do
            suffix="${f#"${prefix}"}"
            case "$f" in
              *.sha256) continue ;;
            esac
            alias="datadog-cli-${suffix}"
            cp "$f" "$alias"
            case "$alias" in
              *.tar.gz|*.zip) sha256sum "$alias" > "${alias}.sha256" ;;
            esac
          done

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" --draft=false
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
          fi
