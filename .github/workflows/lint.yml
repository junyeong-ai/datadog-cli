name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Code, docs, and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install ShellCheck and zizmor
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: shellcheck@0.11.0,zizmor@1.31.1
          fallback: none

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: shellcheck scripts/install.sh scripts/uninstall.sh tests/install_test.sh
      - name: Test source installation and removal
        run: bash tests/install_test.sh
      - name: Validate workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: "1.7.12"

      - name: Audit workflow security
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format=github .github

      - name: Check generated command reference
        shell: bash
        run: |
          cargo run --locked --example command_reference > "$RUNNER_TEMP/command-reference.md"
          diff -u .claude/skills/datadog-query/reference.md "$RUNNER_TEMP/command-reference.md"
