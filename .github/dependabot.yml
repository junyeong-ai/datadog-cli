version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: "chore"
      include: scope
    ignore:
      # rmcp's StreamableHttpClient signatures use sse-stream types; bump it with rmcp.
      - dependency-name: sse-stream
        update-types:
          - version-update:semver-major
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
      cargo-major:
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      gha-minor-patch:
        update-types:
          - minor
          - patch
      gha-major:
        update-types:
          - major
