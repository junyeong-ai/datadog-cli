codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  status:
    project:
      default:
        target: auto
        informational: true
    patch:
      default:
        target: auto
        informational: true

comment:
  layout: "header,diff,flags,components"
  behavior: default
  require_changes: true

flags:
  unittests:
    paths:
      - src/

ignore:
  - "tests/"
  - "benches/"
  - "examples/"
