[package]
name = "datadog-cli"
version = "0.4.0"
edition = "2024"
rust-version = "1.97"
authors = ["Datadog CLI Contributors"]
description = "High-performance Datadog CLI with natural time parsing and observability tools"
license = "MIT"
repository = "https://github.com/junyeong-ai/datadog-cli"
homepage = "https://github.com/junyeong-ai/datadog-cli"
keywords = ["datadog", "cli", "observability", "monitoring", "apm"]
categories = ["command-line-utilities", "api-bindings", "development-tools::profiling"]
readme = "README.md"

[dependencies]
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "signal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.13.5", features = ["json", "query", "rustls", "system-proxy"], default-features = false }
thiserror = "2.0.21"
chrono = { version = "0.4.45", features = ["serde"] }
interim = { version = "0.2.1", features = ["chrono_0_4"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
dirs = "7.0.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = "8.0.1"
fastrand = "2.5.0"
httpdate = "1.0.3"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["net", "io-util"] }
wiremock = "0.6.5"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support", "html_reports"] }
tempfile = "3.27.0"

[lib]
name = "datadog_cli"
path = "src/lib.rs"

[[bin]]
name = "datadog-cli"
path = "src/main.rs"

[[bench]]
name = "parsing"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
